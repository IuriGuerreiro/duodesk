plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.testvideo'
version = '0.1.0'
android {
  namespace 'expo.modules.testvideo'
  sourceSets.main.assets.srcDirs += ['../resources']
  sourceSets.test.resources.srcDirs += ['../../../../../packages/protocol/test/vectors']
}
dependencies {
  implementation 'io.github.webrtc-sdk:android:150.7871.01'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  testImplementation 'junit:junit:4.13.2'
  // Android's org.json is a stub on the JVM, so unit tests of the control wire format need a real one.
  testImplementation 'org.json:json:20240303'
}
