name: Scaffold checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm build
      - name: Check Expo export artifacts
        run: |
          test -s apps/mobile/dist/metadata.json
          test -s apps/mobile/dist/index.html
          node --input-type=module <<'JS'
          import { readFileSync, statSync } from 'node:fs';
          const root = 'apps/mobile/dist/';
          const metadata = JSON.parse(readFileSync(root + 'metadata.json', 'utf8'));
          for (const platform of ['ios', 'android']) {
            const bundle = metadata.fileMetadata?.[platform]?.bundle;
            if (!bundle || statSync(root + bundle).size === 0) {
              throw new Error(`Missing ${platform} production bundle`);
            }
          }
          JS
