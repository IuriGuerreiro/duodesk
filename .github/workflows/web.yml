name: Marketing site

on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

jobs:
  check:
    name: Web build and config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - run: pnpm --filter @duodesk/web... install --frozen-lockfile
      - run: pnpm --filter @duodesk/web check:deploy
      - uses: actions/upload-artifact@v4
        with:
          name: marketing-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/prod' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://doudesk.elorenlabs.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - run: pnpm --filter @duodesk/web... install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: marketing-dist
          path: apps/web/dist
      - name: Deploy verified assets
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN to the GitHub production environment or repository secrets.'
            exit 1
          fi
          pnpm exec wrangler deploy
      - name: Check live site
        run: |
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 5 \
            --max-time 30 https://doudesk.elorenlabs.com/ -o /tmp/duodesk-live.html
          grep -q '<title>DuoDesk' /tmp/duodesk-live.html
